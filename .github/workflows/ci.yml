name: Canary CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python -m eval.backtest --no-charts --output-dir /tmp/canary-eval
      - run: uv run python scripts/check_report.py /tmp/canary-eval/summary.json
      - name: Build and smoke-test Docker Compose
        run: |
          docker compose up --build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8000/healthz | jq -e '.mode == "synthetic_demo"'
          curl --fail --silent 'http://127.0.0.1:8000/replay/respiratory?day=16' | jq -e '.markers.canary | length > 0'
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify validation snapshot
        run: cmp eval/reports/summary.json frontend/src/lib/data/validation-report.json
      - name: Install and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Smoke-test production routes
        working-directory: frontend
        shell: bash
        run: |
          npm run start -- --port 3100 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:3100/ >/dev/null
          for path in dashboard map alerts alerts/ALT-2026-001 replay validation privacy impact settings; do
            curl --fail --silent "http://127.0.0.1:3100/$path" >/dev/null
          done
          curl --fail --silent http://127.0.0.1:3100/api/v1/backtest/summary |
            jq -e '.data == "simulated" and .comparators.canary.events > 0'
          curl --fail --silent 'http://127.0.0.1:3100/api/v1/replay/scen-respiratory?all=true' |
            jq -e '.days | length > 0'
